name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Single source of truth for the rivet pin (matches ci.yml).
env:
  RIVET_PIN: b9811930fcda0893cf5de40a41f4a25d539b958e
jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag matches VERSION, rivet.rktd, app/version.rkt
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Check CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^## $TAG" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }
      - name: Preflight mandatory signed-update key before platform builds
        shell: bash
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY:-}" ]]; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY missing; skipping expensive platform builds rather than publishing without a signed feed"
            exit 1
          fi

  macos:
    name: macOS build (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            racket-arch: arm64
          - arch: x64
            runner: macos-15-intel
            racket-arch: x64
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (${{ matrix.racket-arch }})
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          architecture: ${{ matrix.racket-arch }}
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Package (ad-hoc; notarization activates when secrets exist)
        run: raco rivet package
      - name: Update-feed zip + checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent dist/podlens.app \
            "podlens-${VERSION}-macos-${{ matrix.arch }}.zip"
          shasum -a 256 "podlens-${VERSION}-macos-${{ matrix.arch }}.zip" \
            > "podlens-${VERSION}-macos-${{ matrix.arch }}.zip.sha256"
      - name: Human installer (DMG) + checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          hdiutil create -volname PodLens -srcfolder dist/podlens.app -ov -format UDZO \
            "podlens-${VERSION}-macos-${{ matrix.arch }}.dmg"
          shasum -a 256 "podlens-${VERSION}-macos-${{ matrix.arch }}.dmg" \
            > "podlens-${VERSION}-macos-${{ matrix.arch }}.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            podlens-*-macos-*.dmg
            podlens-*-macos-*.dmg.sha256
            podlens-*-macos-*.zip
            podlens-*-macos-*.zip.sha256
          if-no-files-found: error

  windows:
    name: Windows MSI + portable zip
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        # raco's HTTPS goes through Racket's OpenSSL, whose Windows
        # certificate-store loader crashes on runner images that ship a
        # certificate d2i_X509 cannot parse. git's own TLS is stable, so
        # clone the pinned checkout and install from the directory.
        run: |
          git clone --no-checkout https://github.com/turlamai/rivet.git rivet-src
          git -C rivet-src checkout ${{ env.RIVET_PIN }}
          raco pkg install --auto --no-docs ./rivet-src
        shell: bash
      - name: Install WiX (v5; v7 requires EULA acceptance, v5 runs the v4 schema)
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      - name: Package + MSI (rivet release, development signing)
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turlamai/podlens/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: podlens-2026-10
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          KEY_PEM="$(mktemp)"
          printf '%s\n' "$UPDATE_ED25519_PRIVATE_KEY" > "$KEY_PEM"
          openssl pkey -in "$KEY_PEM" -outform DER -out "$KEY_DER"
          rm -f "$KEY_PEM"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          raco rivet release --development
          rm -f "$KEY_DER"
          # podlens ships one merged signed feed from the publish job; the
          # per-windows manifest rivet emits here is not shipped.
          rm -f dist/update-*.json
        shell: bash
      - name: Collect MSI + portable zip + checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          # rivet v0.11.0 emits the MSI and the portable zip directly in
          # family form — no staging directory to compress anymore.
          sha256sum "podlens-${VERSION}-windows-x64.msi" > "podlens-${VERSION}-windows-x64.msi.sha256"
          sha256sum "podlens-${VERSION}-windows-x64.zip" > "podlens-${VERSION}-windows-x64.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/podlens-*-windows-x64.msi
            dist/podlens-*-windows-x64.msi.sha256
            dist/podlens-*-windows-x64.zip
            dist/podlens-*-windows-x64.zip.sha256
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@b9811930fcda0893cf5de40a41f4a25d539b958e
      # Installed after the embeddable runtime so the catalog dependency
      # closure (cext-lib, crypto-lib, keel) resolves against the minimal
      # build — it ships no packages of its own. crypto backs the updater.
      - name: Install Rivet (catalog) and backend packages
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          raco pkg install --auto --no-docs crypto
      - name: Install GTK4, GStreamer, rpm and packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-4-dev libadwaita-1-dev libjson-glib-dev libsecret-1-dev \
            libglib2.0-dev cmake ninja-build pkg-config file \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            rpm desktop-file-utils
      # tar.gz (the update-feed payload) + deb + rpm + AppImage + portable
      # zip + SBOM, launch smoke included. The deb side-payload ships the
      # GStreamer plugin closure (base/good + gst-libav) so m4a/mp3 play on
      # stock Debian/Ubuntu; the AppImage carries its own GTK4 closure, and
      # APPIMAGE_EXTRACT_AND_RUN lets appimagetool run on the runner.
      - name: Fetch appimagetool (release CDN fallback)
        # GitHub's release-asset download endpoint has returned 504 for
        # appimagetool 1.9.0 while the API asset endpoint stayed healthy.
        # Fetch through the CDN when possible, otherwise through the API,
        # and still verify Rivet's pinned SHA-256 before use.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x64)
              asset_arch=x86_64
              digest=46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1
              ;;
            arm64)
              asset_arch=aarch64
              digest=04f45ea45b5aa07bb2b071aed9dbf7a5185d3953b11b47358c1311f11ea94a96
              ;;
            *) echo "::error::unsupported Linux architecture"; exit 1 ;;
          esac
          dest="$RUNNER_TEMP/appimagetool-${asset_arch}.AppImage"
          url="https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-${asset_arch}.AppImage"
          if ! curl -fSL --retry 2 --retry-delay 2 -o "$dest" "$url"; then
            asset_id="$(gh api repos/AppImage/appimagetool/releases/tags/1.9.0               --jq ".assets[] | select(.name==\"appimagetool-${asset_arch}.AppImage\") | .id")"
            gh api -H 'Accept: application/octet-stream'               "repos/AppImage/appimagetool/releases/assets/${asset_id}" > "$dest"
          fi
          actual="$(sha256sum "$dest" | awk '{print $1}')"
          if [ "$actual" != "$digest" ]; then
            echo "::error::appimagetool checksum mismatch (expected $digest, got $actual)"
            exit 1
          fi
          chmod +x "$dest"
          echo "RIVET_APPIMAGETOOL_PATH=$dest" >> "$GITHUB_ENV"
      - name: Release (tar.gz + deb + rpm + AppImage + portable zip)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: raco rivet release --without-updates --development
      - name: Flatpak bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in x64) FPARCH=x86_64 ;; arm64) FPARCH=aarch64 ;; esac
          sudo apt-get install --yes flatpak flatpak-builder
          # User-level everything: runner accounts install runtimes and
          # build without root. GNOME 50 is the oldest supported platform
          # runtime (48 went EOL 2026-03-24); its glibc 2.42 covers the
          # ubuntu-24.04-built payload.
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub \
            "org.gnome.Platform/${FPARCH}/50" "org.gnome.Sdk/${FPARCH}/50"
          # The manifest template carries version/arch/sha placeholders so
          # the archive source's checksum is exact per release.
          cp "dist/podlens-${VERSION}-linux-${ARCH}.tar.gz" .
          SHA="$(sha256sum "podlens-${VERSION}-linux-${ARCH}.tar.gz" | cut -d' ' -f1)"
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__ARCH__/${ARCH}/" \
              -e "s/__SHA256__/${SHA}/" \
              flatpak/site.jrtx.podlens.yml > site.jrtx.podlens.gen.yml
          # --disable-rofiles-fuse: runners have no /dev/fuse.
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo flatpak-build site.jrtx.podlens.gen.yml
          flatpak build-bundle flatpak-repo \
            "podlens-${VERSION}-linux-${ARCH}.flatpak" site.jrtx.podlens stable
          rm -rf flatpak-build flatpak-repo "podlens-${VERSION}-linux-${ARCH}.tar.gz"
          mv "podlens-${VERSION}-linux-${ARCH}.flatpak" dist/
          test -s "dist/podlens-${VERSION}-linux-${ARCH}.flatpak"
      - name: Collect artifacts + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          cd dist
          mv sbom.cdx.json "podlens-${VERSION}-linux-${ARCH}.sbom.cdx.json"
          mv THIRD_PARTY_NOTICES.txt "podlens-${VERSION}-linux-${ARCH}-THIRD_PARTY_NOTICES.txt"
          for f in podlens-*; do
            case "$f" in
              *.sha256) ;;
              *) [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256" ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/podlens-*
          if-no-files-found: error

  release:
    name: Sign manifest + publish
    needs: [macos, windows, linux]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Ed25519 update signing key
        shell: bash
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY:-}" ]]; then
            echo "::error::Missing UPDATE_ED25519_PRIVATE_KEY; refusing to publish without a signed update manifest"
            exit 1
          fi
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install Rivet (catalog; rivet/distribution signs the wrapper)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Install OpenSSL 3
        run: brew install openssl@3
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifact dirs
        run: |
          find dist -mindepth 2 -maxdepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -maxdepth 1 -type d -empty -delete
          ls -la dist/
      - name: Generate + sign update manifest
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$UPDATE_ED25519_PRIVATE_KEY" > "$KEY_FILE"
          # A valid signature is insufficient if installed clients trust a different key.
          OPENSSL3="$(brew --prefix openssl@3)/bin/openssl"
          ACTUAL_PUB="$("$OPENSSL3" pkey -in "$KEY_FILE" -pubout -outform DER | tail -c 32 | base64 | tr -d '\r\n')"
          BACKEND_PUB="$(grep -A1 'define update-public-key-b64' app/update.rkt | grep -oE '"[A-Za-z0-9+/=]+"' | head -1 | tr -d '"')"
          MACOS_PUB="$(grep -E 'public static let publicKeyBase64 = "' macos-host/Sources/RivetHost/UpdateService.swift | cut -d'"' -f2)"
          if [[ -z "$ACTUAL_PUB" || "$ACTUAL_PUB" != "$BACKEND_PUB" || "$ACTUAL_PUB" != "$MACOS_PUB" ]]; then
            echo "::error::Update signing key does not match both shipped clients' pinned Ed25519 public keys"
            exit 1
          fi
          bash scripts/make-update-manifest.sh "${{ github.ref_name }}" dist "$KEY_FILE"
          test -s dist/update-manifest.json || {
            echo "::error::Missing signed update-manifest.json; refusing to publish"
            exit 1
          }
      - name: Audit and stage public packages and license metadata
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$GITHUB_REF_NAME" | cut -c2-)"
          mkdir -p public
          for suffix in \
            macos-arm64.dmg macos-arm64.zip macos-x64.dmg macos-x64.zip \
            windows-x64.msi windows-x64.zip \
            linux-arm64.tar.gz linux-arm64.zip linux-x64.tar.gz linux-x64.zip \
            linux-amd64.deb linux-arm64.deb \
            linux-aarch64.AppImage linux-x86_64.AppImage \
            linux-x64.flatpak linux-arm64.flatpak \
            linux-arm64.sbom.cdx.json linux-x64.sbom.cdx.json \
            linux-arm64-THIRD_PARTY_NOTICES.txt linux-x64-THIRD_PARTY_NOTICES.txt; do
            name="podlens-$VERSION-$suffix"
            test -s "dist/$name" || { echo "::error::Missing or empty $name"; exit 1; }
            cp "dist/$name" "public/$name"
          done
          for arch in aarch64 x86_64; do
            rpm="$(find dist -maxdepth 1 -type f -name "podlens-$VERSION-*-linux-$arch.rpm" -print -quit)"
            test -s "$rpm" || { echo "::error::Missing $arch RPM"; exit 1; }
            cp "$rpm" public/
          done
          cp dist/update-manifest.json public/
          test -s public/update-manifest.json
          cd public
          shasum -a 256 podlens-* | LC_ALL=C sort -k2 > SHA256SUMS
          shasum -a 256 --check SHA256SUMS
          test "$(grep -c '^' SHA256SUMS)" -eq 22
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" -R turlamai/podlens >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" public/* --clobber -R turlamai/podlens
          else
            gh release create "$GITHUB_REF_NAME" public/* \
              -R turlamai/podlens \
              --title "PodLens $GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release view "$GITHUB_REF_NAME" -R turlamai/podlens --json assets --jq '.assets[].name' |
            while IFS= read -r name; do
              if [ ! -f "public/$name" ]; then
                gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes -R turlamai/podlens
              fi
            done
      - name: Attest public build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: public/*
