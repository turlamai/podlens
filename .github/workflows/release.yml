name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The glaze pin lives in ci.yml (single source of truth); validate reads it
# once and every build job consumes the output. The engine (racket/) still
# tests against rivet in CI, but release packaging is glaze-only since #63
# slice 4 retired the native host legs.
jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      glaze-pin: ${{ steps.pin.outputs.glaze-pin }}
      rivet-pin: ${{ steps.pin.outputs.rivet-pin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag matches VERSION and racket/version.rkt
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Check CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^## $TAG" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }
      - name: Preflight mandatory signed-update key before platform builds
        shell: bash
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY:-}" ]]; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY missing; skipping expensive platform builds rather than publishing without a signed feed"
            exit 1
          fi
      - name: Read glaze + rivet pins from ci.yml
        id: pin
        run: |
          pin="$(grep -m1 -E '^ *GLAZE_PIN:' .github/workflows/ci.yml | sed -E 's/.*GLAZE_PIN:[[:space:]]*//')"
          test -n "$pin"
          echo "glaze-pin=$pin" >> "$GITHUB_OUTPUT"
          rpin="$(grep -m1 -E '^ *RIVET_PIN:' .github/workflows/ci.yml | sed -E 's/.*RIVET_PIN:[[:space:]]*//')"
          test -n "$rpin"
          echo "rivet-pin=$rpin" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS build (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            racket-arch: arm64
          - arch: x64
            runner: macos-15-intel
            racket-arch: x64
    env:
      # Production signing lights up as soon as the account-level secrets
      # exist (Developer ID p12 + App Store Connect API key) and applies to
      # every workflow run that has them. Credential contract:
      # DEVELOPER_ID_P12_B64 / DEVELOPER_ID_P12_PASSWORD / ASC_KEY_ID /
      # ASC_ISSUER_ID / ASC_KEY_P8_B64; see glaze docs/production-signing.md.
      MACOS_SIGNING_CONFIGURED: ${{ secrets.DEVELOPER_ID_P12_B64 != '' && secrets.ASC_KEY_P8_B64 != '' }}
      # A tag push is a release: without credentials it must fail closed
      # instead of silently shipping ad-hoc signed artifacts.
      IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (${{ matrix.racket-arch }})
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          architecture: ${{ matrix.racket-arch }}
      - name: Install Rivet + Glaze (catalog)
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ needs.validate.outputs.rivet-pin }}'
          raco pkg install --auto --no-docs 'https://github.com/turlamai/glaze.git#${{ needs.validate.outputs.glaze-pin }}'
      - name: Provision Developer ID certificate
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          DEVELOPER_ID_P12_B64: ${{ secrets.DEVELOPER_ID_P12_B64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$DEVELOPER_ID_P12_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -s "$KEYCHAIN" $(security list-keychains | tr -d '"')
          rm -f "$P12"
          IDENTITY_NAME="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/^[^"]*"(.*)"$/\1/')"
          test -n "$IDENTITY_NAME"
          echo "MACOS_SIGN_IDENTITY=$IDENTITY_NAME" >> "$GITHUB_ENV"
      - name: Store notarytool keychain profile
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          P8="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$ASC_KEY_P8_B64" | base64 --decode > "$P8"
          xcrun notarytool store-credentials ASC_NOTARY \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --key "$P8"
          rm -f "$P8"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build web UI and stage public/
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm -r run build
          mkdir -p public
          cp -R apps/desktop/dist/. public/
      # glaze build signs the .app, wraps the signed bundle into the dmg and
      # notarizes + staples when a profile is given; without credentials a
      # tag release fails closed above the build instead of shipping ad-hoc.
      - name: Reclaim disk before carrier build
        run: |
          set -euo pipefail
          df -h .
          # node_modules and the pnpm store are dead weight once public/ is
          # staged; hdiutil needs headroom for the dmg scratch image.
          rm -rf node_modules apps/*/node_modules packages/*/node_modules
          pnpm store prune || true
          df -h .
      - name: Build (Developer ID + notarized)
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        run: |
          raco glaze build \
            --name podlens \
            --version "${GITHUB_REF_NAME#v}" \
            --publisher "Turing Lambda" \
            --identifier site.jrtx.podlens \
            --entry main.rkt \
            --installer \
            --icon assets/branding/app.icns \
            --dmg-background assets/branding/dmg-background.png \
            --sign "$MACOS_SIGN_IDENTITY" \
            --notarize ASC_NOTARY
      - name: Build (ad-hoc dispatch smoke)
        if: env.MACOS_SIGNING_CONFIGURED != 'true' && env.IS_TAG_RELEASE != 'true'
        run: |
          raco glaze build \
            --name podlens \
            --version "${GITHUB_REF_NAME#v}" \
            --publisher "Turing Lambda" \
            --identifier site.jrtx.podlens \
            --entry main.rkt \
            --installer \
            --icon assets/branding/app.icns \
            --dmg-background assets/branding/dmg-background.png
      - name: Build requires signing credentials
        if: env.MACOS_SIGNING_CONFIGURED != 'true' && env.IS_TAG_RELEASE == 'true'
        run: |
          echo "::error::Tag releases must be production-signed: set the macOS signing secrets (DEVELOPER_ID_P12_B64, DEVELOPER_ID_P12_PASSWORD, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64) on this repository before tagging."
          exit 1
      - name: Update-feed zip + checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent dist/podlens.app \
            "podlens-${VERSION}-macos-${{ matrix.arch }}.zip"
          shasum -a 256 "podlens-${VERSION}-macos-${{ matrix.arch }}.zip" \
            > "podlens-${VERSION}-macos-${{ matrix.arch }}.zip.sha256"
      - name: Human installer (DMG) + checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv dist/podlens.dmg "podlens-${VERSION}-macos-${{ matrix.arch }}.dmg"
          shasum -a 256 "podlens-${VERSION}-macos-${{ matrix.arch }}.dmg" \
            > "podlens-${VERSION}-macos-${{ matrix.arch }}.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            podlens-*-macos-*.dmg
            podlens-*-macos-*.dmg.sha256
            podlens-*-macos-*.zip
            podlens-*-macos-*.zip.sha256
          if-no-files-found: error

  windows:
    name: Windows MSI + portable zip
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Export trusted Mozilla CA roots for Windows Racket
        shell: pwsh
        run: |
          # Racket's Windows ROOT-store loader may throw X509*->C on hosted
          # images, even for catalog dependency resolution of a local
          # install. Node bundles independent Mozilla roots; never bypass
          # TLS certificate or hostname verification.
          $bundle = Join-Path $env:RUNNER_TEMP 'podlens-mozilla-roots.pem'
          $js = 'const tls=require("node:tls"),fs=require("node:fs"); if(tls.rootCertificates.length<50) process.exit(2); fs.writeFileSync(process.argv[1],tls.rootCertificates.join("\n")+"\n",{flag:"wx"});'
          node -e $js $bundle
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $bundle -PathType Leaf)) {
            throw "Unable to export trusted CA roots; refusing insecure TLS fallback"
          }
          "PODLENS_CI_CA_BUNDLE=$bundle" >> $env:GITHUB_ENV
      - name: Install Rivet + Glaze (pinned, verified TLS)
        env:
          RIVET_PIN: ${{ needs.validate.outputs.rivet-pin }}
          GLAZE_PIN: ${{ needs.validate.outputs.glaze-pin }}
        shell: pwsh
        run: racket scripts/ci-install-windows-deps.rkt
      - name: Install WiX (v5; v7 requires EULA acceptance, v5 runs the v4 schema)
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"
        shell: bash
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build web UI and stage public/
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm -r run build
          mkdir -p public
          cp -R apps/desktop/dist/. public/
      # No Windows signing certificate is configured for this repository;
      # glaze labels the installer unsigned rather than failing the release
      # (family policy: the Windows certificate is optional).
      - name: Build MSI + distribution
        shell: bash
        run: |
          raco glaze build \
            --name podlens \
            --version "${GITHUB_REF_NAME#v}" \
            --publisher "Turing Lambda" \
            --identifier site.jrtx.podlens \
            --entry main.rkt \
            --installer \
            --icon assets/branding/app.ico \
            --installer-license LICENSE \
            --installer-banner assets/branding/wizard-banner.bmp \
            --installer-dialog assets/branding/wizard-dialog.bmp
          test -s dist/podlens.msi
      - name: Collect MSI + portable zip + checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $msi = "podlens-$version-windows-x64.msi"
          Move-Item dist/podlens.msi $msi
          $hash = (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLowerInvariant()
          "$hash  $msi" | Set-Content -Encoding ascii "$msi.sha256"
          # Portable update payload: the whole distribution tree except the
          # installer itself (exe + dlls + lib/ + public/).
          $items = Get-ChildItem dist -Exclude *.msi, *.sha256
          $zip = "podlens-$version-windows-x64.zip"
          Compress-Archive -Path $items.FullName -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii "$zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            podlens-*-windows-x64.msi
            podlens-*-windows-x64.msi.sha256
            podlens-*-windows-x64.zip
            podlens-*-windows-x64.zip.sha256
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install Rivet + Glaze (catalog)
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ needs.validate.outputs.rivet-pin }}'
          raco pkg install --auto --no-docs 'https://github.com/turlamai/glaze.git#${{ needs.validate.outputs.glaze-pin }}'
      - name: Install packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm desktop-file-utils file
      # tar.gz (the update-feed payload) + deb + rpm + AppImage. The deb/rpm
      # payloads declare the WebKitGTK/GStreamer runtime dependencies; the
      # AppImage carries its own closure, and APPIMAGE_EXTRACT_AND_RUN lets
      # appimagetool run on the runner.
      - name: Fetch appimagetool (release CDN fallback)
        # GitHub's release-asset download endpoint has returned 504 for
        # appimagetool 1.9.0 while the API asset endpoint stayed healthy.
        # Fetch through the CDN when possible, otherwise through the API,
        # and still verify the pinned SHA-256 before use.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x64)
              asset_arch=x86_64
              digest=46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1
              ;;
            arm64)
              asset_arch=aarch64
              digest=04f45ea45b5aa07bb2b071aed9dbf7a5185d3953b11b47358c1311f11ea94a96
              ;;
            *) echo "::error::unsupported Linux architecture"; exit 1 ;;
          esac
          dest="$RUNNER_TEMP/appimagetool-${asset_arch}.AppImage"
          url="https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-${asset_arch}.AppImage"
          if ! curl -fSL --retry 2 --retry-delay 2 -o "$dest" "$url"; then
            asset_id="$(gh api repos/AppImage/appimagetool/releases/tags/1.9.0 \
              --jq ".assets[] | select(.name==\"appimagetool-${asset_arch}.AppImage\") | .id")"
            gh api -H 'Accept: application/octet-stream' \
              "repos/AppImage/appimagetool/releases/assets/${asset_id}" > "$dest"
          fi
          actual="$(sha256sum "$dest" | awk '{print $1}')"
          if [ "$actual" != "$digest" ]; then
            echo "::error::appimagetool checksum mismatch (expected $digest, got $actual)"
            exit 1
          fi
          chmod +x "$dest"
          # glaze locates the tool by name on PATH.
          mkdir -p "$RUNNER_TEMP/bin"
          cp "$dest" "$RUNNER_TEMP/bin/appimagetool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build web UI and stage public/
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm -r run build
          mkdir -p public
          cp -R apps/desktop/dist/. public/
      - name: Build (tar.gz tree + deb + rpm + AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          raco glaze build \
            --name podlens \
            --version "${GITHUB_REF_NAME#v}" \
            --publisher "Turing Lambda" \
            --identifier site.jrtx.podlens \
            --entry main.rkt \
            --installer \
            --icon assets/branding/app.png
          test -s dist/podlens.deb
          test -s dist/podlens.rpm
          test -s dist/podlens.AppImage
      - name: Flatpak bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in x64) FPARCH=x86_64 ;; arm64) FPARCH=aarch64 ;; esac
          sudo apt-get install --yes flatpak flatpak-builder
          # User-level everything: runner accounts install runtimes and
          # build without root. GNOME 50 ships WebKitGTK 4.1 (GTK3) and the
          # GStreamer closure the glaze carrier needs; assert both before
          # spending time on the bundle.
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub \
            "org.gnome.Platform/${FPARCH}/50" "org.gnome.Sdk/${FPARCH}/50"
          flatpak run --command=sh "org.gnome.Sdk/${FPARCH}/50" -c \
            'ls /usr/lib/*/libwebkit2gtk-4.1.so* /usr/lib/*/libgtk-3.so*'
          # The manifest template carries file-source path rewrites so the
          # generated manifest at the repo root resolves them. The payload
          # enters as a dir source staged from dist/ (bin/ + lib/ + public/):
          # flatpak-builder archive sources need absolute URIs, and a local
          # dir source keeps the bundle byte-identical to the update payload.
          mkdir -p flatpak-src
          cp -a dist/bin dist/lib dist/public flatpak-src/
          sed -e 's|path: podlens.sh|path: flatpak/podlens.sh|' \
              -e 's|path: site.jrtx.podlens.desktop|path: flatpak/site.jrtx.podlens.desktop|' \
              -e 's|path: app.png|path: assets/branding/app.png|' \
              flatpak/site.jrtx.podlens.yml > site.jrtx.podlens.gen.yml
          # --disable-rofiles-fuse: runners have no /dev/fuse.
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --default-branch=stable --repo=flatpak-repo flatpak-build site.jrtx.podlens.gen.yml
          flatpak build-bundle flatpak-repo \
            "podlens-${VERSION}-linux-${ARCH}.flatpak" site.jrtx.podlens stable
          # Structural smoke: install the exact bundle and check the payload
          # the carrier resolves at runtime (exe + public/ tree).
          flatpak --user install -y --noninteractive \
            "podlens-${VERSION}-linux-${ARCH}.flatpak"
          flatpak run --command=sh site.jrtx.podlens -c \
            'test -x /app/podlens/bin/podlens && test -d /app/podlens/public && test -f /app/share/icons/hicolor/512x512/apps/site.jrtx.podlens.png'
          rm -rf flatpak-build flatpak-repo "podlens-${VERSION}-linux-${ARCH}.tar.gz"
          mv "podlens-${VERSION}-linux-${ARCH}.flatpak" dist/
          test -s "dist/podlens-${VERSION}-linux-${ARCH}.flatpak"
      - name: Collect artifacts + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in
            x64) DEB_ARCH=amd64; RPM_ARCH=x86_64 ;;
            arm64) DEB_ARCH=arm64; RPM_ARCH=aarch64 ;;
          esac
          raco glaze compliance --out dist
          cd dist
          mv podlens.deb "podlens-${VERSION}-linux-${DEB_ARCH}.deb"
          mv podlens.rpm "podlens-${VERSION}-linux-${RPM_ARCH}.rpm"
          mv podlens.AppImage "podlens-${VERSION}-linux-${RPM_ARCH}.AppImage"
          # Portable update payload: the same tree the flatpak bundle wraps.
          tar -czf "podlens-${VERSION}-linux-${ARCH}.tar.gz" bin lib public
          mv glaze-sbom.cdx.json "podlens-${VERSION}-linux-${ARCH}.sbom.cdx.json"
          mv glaze-notices.txt "podlens-${VERSION}-linux-${ARCH}-THIRD_PARTY_NOTICES.txt"
          for f in podlens-*; do
            case "$f" in
              *.sha256) ;;
              *) [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256" ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/podlens-*
          if-no-files-found: error

  release:
    name: Sign manifest + publish
    needs: [macos, windows, linux]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Ed25519 update signing key
        shell: bash
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY:-}" ]]; then
            echo "::error::Missing UPDATE_ED25519_PRIVATE_KEY; refusing to publish without a signed update manifest"
            exit 1
          fi
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install Glaze (catalog; glaze/update signs and gates the feed)
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turlamai/glaze.git#${{ needs.validate.outputs.glaze-pin }}'
      - name: Install OpenSSL 3
        run: brew install openssl@3
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifact dirs
        run: |
          find dist -mindepth 2 -maxdepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -maxdepth 1 -type d -empty -delete
          ls -la dist/
      - name: Generate + sign update manifest
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$UPDATE_ED25519_PRIVATE_KEY" > "$KEY_FILE"
          # A valid signature is insufficient if installed clients trust a different key.
          OPENSSL3="$(brew --prefix openssl@3)/bin/openssl"
          ACTUAL_PUB="$("$OPENSSL3" pkey -in "$KEY_FILE" -pubout -outform DER | tail -c 32 | base64 | tr -d '\r\n')"
          BACKEND_PUB="$(grep -A1 'define update-public-key-b64' racket/update.rkt | grep -oE '"[A-Za-z0-9+/=]+"' | head -1 | tr -d '"')"
          if [[ -z "$ACTUAL_PUB" || "$ACTUAL_PUB" != "$BACKEND_PUB" ]]; then
            echo "::error::Update signing key does not match the shipped client's pinned Ed25519 public key"
            exit 1
          fi
          bash scripts/make-update-manifest.sh "${{ github.ref_name }}" dist "$KEY_FILE"
          test -s dist/update-manifest.json || {
            echo "::error::Missing signed update-manifest.json; refusing to publish"
            exit 1
          }
      - name: Audit and stage public packages and license metadata
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$GITHUB_REF_NAME" | cut -c2-)"
          mkdir -p public
          for suffix in \
            macos-arm64.dmg macos-arm64.zip macos-x64.dmg macos-x64.zip \
            windows-x64.msi windows-x64.zip \
            linux-arm64.tar.gz linux-x64.tar.gz \
            linux-amd64.deb linux-arm64.deb \
            linux-aarch64.AppImage linux-x86_64.AppImage \
            linux-x64.flatpak linux-arm64.flatpak \
            linux-arm64.sbom.cdx.json linux-x64.sbom.cdx.json \
            linux-arm64-THIRD_PARTY_NOTICES.txt linux-x64-THIRD_PARTY_NOTICES.txt; do
            name="podlens-$VERSION-$suffix"
            test -s "dist/$name" || { echo "::error::Missing or empty $name"; exit 1; }
            cp "dist/$name" "public/$name"
          done
          for arch in aarch64 x86_64; do
            rpm="$(find dist -maxdepth 1 -type f -name "podlens-$VERSION-*-linux-$arch.rpm" -print -quit)"
            test -s "$rpm" || { echo "::error::Missing $arch RPM"; exit 1; }
            cp "$rpm" public/
          done
          cp dist/update-manifest.json public/
          test -s public/update-manifest.json
          cd public
          shasum -a 256 podlens-* | LC_ALL=C sort -k2 > SHA256SUMS
          shasum -a 256 --check SHA256SUMS
          test "$(grep -c '^' SHA256SUMS)" -eq 20
      - name: Gate signed feed against staged assets
        run: |
          set -euo pipefail
          OPENSSL3="$(brew --prefix openssl@3)/bin/openssl"
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$UPDATE_ED25519_PRIVATE_KEY" > "$KEY_FILE"
          "$OPENSSL3" pkey -in "$KEY_FILE" -pubout -out "$RUNNER_TEMP/update-public.pem"
          raco glaze verify-release-assets public/update-manifest.json public \
            "$RUNNER_TEMP/update-public.pem" \
            --base-url "https://github.com/turlamai/podlens/releases/download/${{ github.ref_name }}" \
            --json
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" -R turlamai/podlens >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" public/* --clobber -R turlamai/podlens
          else
            gh release create "$GITHUB_REF_NAME" public/* \
              -R turlamai/podlens \
              --title "PodLens $GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release view "$GITHUB_REF_NAME" -R turlamai/podlens --json assets --jq '.assets[].name' |
            while IFS= read -r name; do
              if [ ! -f "public/$name" ]; then
                gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes -R turlamai/podlens
              fi
            done
      - name: Attest public build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: public/*