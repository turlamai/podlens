name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Keep every main/manual quality gate; only superseded runs of the same PR cancel.
  # A unique run ID also prevents a pending main run from replacing another.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Single source of truth for the rivet pin; every install step below
# references this so a bump is one edit, not a grep-replace across jobs.
env:
  # The engine (racket/) still builds and tests against rivet; the UI
  # carrier is glaze (#63 slice 4 retired the three native host legs).
  RIVET_PIN: c1f0d921e2136c0cfb2c1c1f6d273f2b26222a19
  GLAZE_RIVET_PIN: c1f0d921e2136c0cfb2c1c1f6d273f2b26222a19
  GLAZE_PIN: e2731a3a1440c9cf705f2c0e77b945a3dec05e79
jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Version preflight (VERSION == racket/version.rkt)
        run: bash scripts/check-release-version.sh
        shell: bash
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Export trusted Mozilla CA roots for Windows Racket
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Racket's Windows ROOT-store loader may throw X509*->C on hosted images.
          # Node bundles independent Mozilla roots; do not bypass TLS validation.
          $bundle = Join-Path $env:RUNNER_TEMP 'podlens-mozilla-roots.pem'
          $js = 'const tls=require("node:tls"),fs=require("node:fs"); if(tls.rootCertificates.length<50) process.exit(2); fs.writeFileSync(process.argv[1],tls.rootCertificates.join("\n")+"\n",{flag:"wx"});'
          node -e $js $bundle
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $bundle -PathType Leaf)) {
            throw "Unable to export trusted CA roots; refusing insecure TLS fallback"
          }
          "PODLENS_CI_CA_BUNDLE=$bundle" >> $env:GITHUB_ENV
      - name: Install pinned Rivet with verified TLS
        if: runner.os == 'Windows'
        shell: pwsh
        run: racket scripts/ci-install-windows-deps.rkt
      - name: Install Rivet + Glaze (catalog)
        if: runner.os != 'Windows'
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          raco pkg install --auto --no-docs 'https://github.com/turlamai/glaze.git#${{ env.GLAZE_PIN }}'
        shell: bash
      - name: Compile backend
        run: raco make racket/core/*.rkt racket/update.rkt racket/backend.rkt racket/cli.rkt
        shell: bash
      - name: Run tests
        run: raco test tests/
        shell: bash
      # network-dependent: a dead feed must not block the pipeline, but a
      # failure is surfaced so the catalog gets pruned before the release
      - name: Verify curated catalog (soft)
        run: racket scripts/verify-catalog.rkt
        shell: bash
        continue-on-error: true
        if: matrix.os == 'ubuntu-latest'
      - name: CLI smoke
        shell: bash
        env:
          PODLENS_DATA_DIR: ${{ runner.temp }}/podlens-cli-smoke
        run: |
          racket racket/cli.rkt version
          racket racket/cli.rkt --json version
          racket racket/cli.rkt doctor
          racket racket/cli.rkt bad-command 2>/dev/null && exit 1 || test $? -eq 2

  glaze-adapter:
    name: Glaze adapter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # GPU-less hosted runners have no DRI3 device; WebKitGTK must fall back
    # to the software path or webview startup crashes (glaze docs/ci.md).
    env:
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      # Acceptance-only hatch (glaze docs/ci.md): synthetic clicks must be
      # able to start AUDIBLE playback, else the journey's muted fallback
      # kicks in and OS Now Playing (MPRIS/SMTC/MediaRemote) legitimately
      # stays empty for muted media.
      GLAZE_ALLOW_PROGRAMMATIC_PLAYBACK: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      # raco's HTTPS goes through Racket's OpenSSL, whose Windows
      # certificate-store loader crashes on some runner images; git's own
      # TLS is stable, so clone the pinned checkouts and install from disk.
      - name: Install pinned Rivet + Glaze (Windows, git TLS)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git clone --no-checkout https://github.com/turlamai/rivet.git rivet-src
          git -C rivet-src checkout ${{ env.GLAZE_RIVET_PIN }}
          raco pkg install --auto --no-docs ./rivet-src
          git clone --no-checkout https://github.com/turlamai/glaze.git glaze-src
          git -C glaze-src checkout ${{ env.GLAZE_PIN }}
          raco pkg install --auto --no-docs ./glaze-src
      - name: Install pinned Rivet + Glaze (catalog)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.GLAZE_RIVET_PIN }}'
          raco pkg install --auto --no-docs 'https://github.com/turlamai/glaze.git#${{ env.GLAZE_PIN }}'
      - name: Linux webview runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -o DPkg::Lock::Timeout=120 -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 libgtk-3-0 libwebkit2gtk-4.1-0 xvfb pulseaudio dbus \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      # The seeded listening journeys play real media; WebKitGTK needs an
      # audio sink or the media clock stalls. Headless runners have none,
      # so give PulseAudio a null sink for the verify step.
      - name: Linux audio null sink
        if: runner.os == 'Linux'
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Schema compat gate (zero breaking)
        shell: bash
        run: raco glaze schema check --json
      - name: Compile adapter
        shell: bash
        run: raco make backend/main.rkt
      - name: Adapter contract test
        shell: bash
        run: racket backend/tests/adapter-test.rkt
      - name: RPC surface gate + generated client + i18n table
        shell: bash
        run: |
          pnpm gen:rpc
          pnpm gen:i18n
          python scripts/check-rpc-surface.py
      - name: Web typecheck + build
        shell: bash
        run: |
          pnpm check
          pnpm build
      - name: Real-window verify (Linux, Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        # Session bus on /run/user for WebKitGTK's sandboxed MPRIS bridge.
        run: bash scripts/acceptance/linux-verify.sh
      - name: Precompile macOS Now Playing probe
        if: runner.os == 'macOS'
        shell: bash
        # Hosted macOS swiftc cold-compiles slower than the in-verify probe
        # budget; build once here so the probe thread only executes it.
        run: |
          swiftc scripts/acceptance/nowplaying-probe.swift -o "$RUNNER_TEMP/nowplaying-probe"
          echo "PODLENS_NOWPLAYING_PROBE_BIN=$RUNNER_TEMP/nowplaying-probe" >> "$GITHUB_ENV"
      - name: Real-window verify
        if: runner.os != 'Linux'
        shell: bash
        run: racket verify.rkt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glaze-verify-${{ matrix.os }}
          path: .glaze/verify/*.png
          if-no-files-found: warn
