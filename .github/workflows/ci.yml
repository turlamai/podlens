name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Keep every main/manual quality gate; only superseded runs of the same PR cancel.
  # A unique run ID also prevents a pending main run from replacing another.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Single source of truth for the rivet pin; every install step below
# references this so a bump is one edit, not a grep-replace across jobs.
env:
  RIVET_PIN: 78ca0c0cb234ee75c0bca54db6c12d0faf4c3b91
  # Glaze-line adapter pins (#63): the adapter job builds against current
  # upstream main heads verified locally; the native-host jobs above keep
  # their historical RIVET_PIN until the native legs retire (slice 4).
  GLAZE_RIVET_PIN: bf7a62b9a3331bd5d6df48d1b7fe77be0cfed90d
  GLAZE_PIN: 2ec4533c4663cd058018c669af56b85c137a4a2a
jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Version preflight (VERSION == rivet.rktd == racket/version.rkt)
        run: bash scripts/check-release-version.sh
        shell: bash
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Export trusted Mozilla CA roots for Windows Racket
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Racket's Windows ROOT-store loader may throw X509*->C on hosted images.
          # Node bundles independent Mozilla roots; do not bypass TLS validation.
          $bundle = Join-Path $env:RUNNER_TEMP 'podlens-mozilla-roots.pem'
          $js = 'const tls=require("node:tls"),fs=require("node:fs"); if(tls.rootCertificates.length<50) process.exit(2); fs.writeFileSync(process.argv[1],tls.rootCertificates.join("\n")+"\n",{flag:"wx"});'
          node -e $js $bundle
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $bundle -PathType Leaf)) {
            throw "Unable to export trusted CA roots; refusing insecure TLS fallback"
          }
          "PODLENS_CI_CA_BUNDLE=$bundle" >> $env:GITHUB_ENV
      - name: Install pinned Rivet with verified TLS
        if: runner.os == 'Windows'
        shell: pwsh
        run: racket scripts/ci-install-windows-deps.rkt
      - name: Install Rivet (catalog)
        if: runner.os != 'Windows'
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Compile backend
        run: raco make racket/core/*.rkt racket/update.rkt racket/backend.rkt racket/cli.rkt
        shell: bash
      - name: Run tests
        run: raco test tests/
        shell: bash
      # network-dependent: a dead feed must not block the pipeline, but a
      # failure is surfaced so the catalog gets pruned before the release
      - name: Verify curated catalog (soft)
        run: racket scripts/verify-catalog.rkt
        shell: bash
        continue-on-error: true
        if: matrix.os == 'ubuntu-latest'
      - name: CLI smoke
        shell: bash
        env:
          PODLENS_DATA_DIR: ${{ runner.temp }}/podlens-cli-smoke
        run: |
          racket racket/cli.rkt version
          racket racket/cli.rkt --json version
          racket racket/cli.rkt doctor
          racket racket/cli.rkt bad-command 2>/dev/null && exit 1 || test $? -eq 2

  macos-host:
    name: macOS host build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS, arm64)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          architecture: arm64
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Build + package + verify
        run: raco rivet package
      - name: Launch smoke (ad-hoc build)
        run: |
          open dist/podlens.app
          sleep 10
          pgrep -f "podlens.app" >/dev/null || { echo "::error::app did not stay running"; exit 1; }
          pkill -f "podlens.app" || true

  linux-host:
    name: Linux host (GTK4 build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK toolchain + GStreamer dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev libjson-glib-dev \
            libsecret-1-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      # Builds and caches the embeddable Racket CS runtime and exports
      # RIVET_RACKET_* (rivet's own composite action) — the Linux host links
      # a static libracketcs, which the distro Racket does not ship.
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@994047c310c749d3e16d873f33fc073dca0c6521
      # Installed after the embeddable runtime so the catalog dependency
      # closure (cext-lib, crypto-lib, keel) resolves against the minimal
      # build — it ships no packages of its own. crypto backs the updater.
      - name: Install Rivet (catalog) and backend packages
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          raco pkg install --auto --no-docs crypto
      - name: Build host (generates linux/GeneratedBackend.hpp + compiles)
        run: raco rivet build
      - name: Headless boot smoke
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a ./.rivet/stage/RivetHost &
          APP_PID=$!
          sleep 8
          kill -0 $APP_PID
          kill $APP_PID

  windows-host:
    name: Windows host build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        # raco's HTTPS goes through Racket's OpenSSL, whose Windows
        # certificate-store loader crashes on runner images that ship a
        # certificate d2i_X509 cannot parse (issue seen intermittently
        # killing this exact step). git's own TLS is stable, so clone the
        # pinned checkout and install from the directory.
        run: |
          git clone --no-checkout https://github.com/turlamai/rivet.git rivet-src
          git -C rivet-src checkout ${{ env.RIVET_PIN }}
          raco pkg install --auto --no-docs ./rivet-src
        shell: bash
      - name: Build + package + verify
        run: raco rivet package
        shell: bash

  glaze-adapter:
    name: Glaze adapter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      # raco's HTTPS goes through Racket's OpenSSL, whose Windows
      # certificate-store loader crashes on some runner images; git's own
      # TLS is stable, so clone the pinned checkouts and install from disk.
      - name: Install pinned Rivet + Glaze (Windows, git TLS)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git clone --no-checkout https://github.com/turlamai/rivet.git rivet-src
          git -C rivet-src checkout ${{ env.GLAZE_RIVET_PIN }}
          raco pkg install --auto --no-docs ./rivet-src
          git clone --no-checkout https://github.com/turlamai/glaze.git glaze-src
          git -C glaze-src checkout ${{ env.GLAZE_PIN }}
          raco pkg install --auto --no-docs ./glaze-src
      - name: Install pinned Rivet + Glaze (catalog)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.GLAZE_RIVET_PIN }}'
          raco pkg install --auto --no-docs 'https://github.com/turlamai/glaze.git#${{ env.GLAZE_PIN }}'
      - name: Linux webview runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Schema compat gate (zero breaking)
        shell: bash
        run: raco rivet schema check rivet-schema.json --json
      - name: Compile adapter
        shell: bash
        run: raco make backend/main.rkt
      - name: Adapter contract test
        shell: bash
        run: racket backend/tests/adapter-test.rkt
      - name: RPC surface gate + generated client + i18n table
        shell: bash
        run: |
          pnpm gen:rpc
          pnpm gen:i18n
          python scripts/check-rpc-surface.py
      - name: Web typecheck + build
        shell: bash
        run: |
          pnpm check
          pnpm build
      - name: Real-window verify (Linux, Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a racket verify.rkt
      - name: Real-window verify
        if: runner.os != 'Linux'
        shell: bash
        run: racket verify.rkt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glaze-verify-${{ matrix.os }}
          path: .glaze/verify/*.png
          if-no-files-found: warn
