name: Product Acceptance

# Glaze-stack product acceptance (#63 slice 4): the native WinUI/SwiftUI/GTK4
# legs retired, so acceptance is the single shared web UI exercised in a real
# native window on every supported platform. verify.rkt is the acceptance
# owner (glaze docs/product-acceptance.md): seeded listening journeys, real
# media clock, persisted-effect assertions and PNG evidence. The framework
# envelope (`raco glaze acceptance`: doctor + compliance) rides along, and a
# final matrix job folds the per-platform reports fail-closed.
#
# Packaged-artifact evidence (install shapes, N->N+1 upgrade, rollback) lives
# in the release path: release.yml + appimage-upgrade-qualification.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep every main/manual quality gate; only superseded runs of the same PR cancel.
  # A unique run ID also prevents a pending main run from replacing another.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Real-window acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # GPU-less hosted runners have no DRI3 device; WebKitGTK must fall back
    # to the software path or webview startup crashes (glaze docs/ci.md).
    env:
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Read the carrier pins from ci.yml (single source of truth)
        shell: bash
        run: |
          set -euo pipefail
          for key in RIVET_PIN GLAZE_RIVET_PIN GLAZE_PIN; do
            pin="$(grep -m1 -E "^ *${key}:" .github/workflows/ci.yml | sed -E "s/.*${key}:[[:space:]]*//")"
            test -n "$pin"
            echo "${key}=$pin" >> "$GITHUB_ENV"
          done
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      # raco's HTTPS goes through Racket's OpenSSL, whose Windows
      # certificate-store loader crashes on some runner images; git's own
      # TLS is stable, so clone the pinned checkouts and install from disk.
      # Directory names must stay canonical (glaze/rivet): a link install
      # takes its package name from the directory, and `raco glaze
      # acceptance`'s doctor leg fails closed on non-canonical names.
      - name: Install pinned Rivet + Glaze (Windows, git TLS)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git clone --no-checkout https://github.com/turlamai/rivet.git rivet
          git -C rivet checkout "$GLAZE_RIVET_PIN"
          raco pkg install --auto --no-docs ./rivet
          git clone --no-checkout https://github.com/turlamai/glaze.git glaze
          git -C glaze checkout "$GLAZE_PIN"
          raco pkg install --auto --no-docs ./glaze
      - name: Install pinned Rivet + Glaze (catalog)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${GLAZE_RIVET_PIN}"
          raco pkg install --auto --no-docs "https://github.com/turlamai/glaze.git#${GLAZE_PIN}"
      - name: Linux webview runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 libgtk-3-0 libwebkit2gtk-4.1-0 xvfb pulseaudio dbus \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      # The seeded listening journeys play real media; WebKitGTK needs an
      # audio sink or the media clock stalls. Headless runners have none,
      # so give PulseAudio a null sink for the verify step.
      - name: Linux audio null sink
        if: runner.os == 'Linux'
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Web typecheck + build
        shell: bash
        run: |
          pnpm check
          pnpm build
      - name: Real-window acceptance (Linux, Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        # Session bus on /run/user: WebKitGTK's sandboxed web process reaches
        # the bus via xdg-dbus-proxy, which only sees /run (WebKit bug
        # 246159); a /tmp dbus-run-session socket starves the MPRIS bridge.
        run: bash scripts/acceptance/linux-verify.sh
      - name: Precompile macOS Now Playing probe
        if: runner.os == 'macOS'
        shell: bash
        # Hosted macOS swiftc cold-compiles slower than the in-verify probe
        # budget; build once here so the probe thread only executes it.
        run: |
          swiftc scripts/acceptance/nowplaying-probe.swift -o "$RUNNER_TEMP/nowplaying-probe"
          echo "PODLENS_NOWPLAYING_PROBE_BIN=$RUNNER_TEMP/nowplaying-probe" >> "$GITHUB_ENV"
      - name: Real-window acceptance
        if: runner.os != 'Linux'
        shell: bash
        run: racket verify.rkt
      - name: Framework acceptance envelope (doctor + compliance)
        shell: bash
        run: |
          mkdir -p .glaze/acceptance
          raco glaze acceptance --json --out .glaze/acceptance/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: podlens-acceptance-${{ matrix.os }}
          path: |
            .glaze/verify/*.png
            .glaze/acceptance/report.json
          if-no-files-found: warn

  matrix:
    name: Cross-platform acceptance matrix
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read the glaze pin from ci.yml
        shell: bash
        run: |
          pin="$(grep -m1 -E '^ *GLAZE_PIN:' .github/workflows/ci.yml | sed -E 's/.*GLAZE_PIN:[[:space:]]*//')"
          test -n "$pin"
          echo "GLAZE_PIN=$pin" >> "$GITHUB_ENV"
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install pinned Glaze (catalog)
        run: raco pkg install --auto --no-docs "https://github.com/turlamai/glaze.git#${GLAZE_PIN}"
      - uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: podlens-acceptance-*
      - name: Fold the per-platform reports (fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .glaze/acceptance
          raco glaze matrix reports/*/acceptance/report.json --json | tee .glaze/acceptance/matrix.json
          jq -e '.ok == true' .glaze/acceptance/matrix.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: podlens-acceptance-matrix
          path: .glaze/acceptance/matrix.json
          if-no-files-found: warn