<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>PodLens — 原型导航</title><link rel="stylesheet" href="prototype/shared.css">
<style>
.prototype-directory { max-width:960px;margin:0 auto;padding:32px 16px 48px;background:var(--canvas);color:var(--ink) }
.directory-header { display:flex;align-items:center;gap:16px;margin-bottom:32px }.directory-header h1 { flex:1;font:600 28px/1.3 var(--sans);letter-spacing:0 }
.directory-theme { min-width:44px;min-height:44px;padding:8px 16px;border:1px solid var(--hairline);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer }
.directory-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px }.directory-grid h2 { font-size:20px;margin-bottom:8px }.directory-grid p { font-size:13px;color:var(--ink-soft);line-height:1.6;margin-bottom:16px }
.directory-links { display:grid;gap:8px }.directory-links a { display:flex;align-items:center;min-height:48px;padding:12px 16px;border:1px solid var(--hairline);border-radius:8px;background:var(--surface);color:var(--ink);font:400 16px/1.5 var(--sans) }
.directory-states { margin-top:32px;border-top:1px solid var(--hairline);padding-top:24px }.directory-states h2 { font-size:18px;margin-bottom:12px }.directory-states .directory-links { grid-template-columns:repeat(2,minmax(0,1fr)) }.directory-contract { display:inline-flex;align-items:center;min-height:44px;margin-top:24px;color:var(--accent-deep) }
@media(hover:hover){.directory-links a:hover,.directory-theme:hover { background:var(--raised) }}
@media(max-width:600px){.directory-grid,.directory-states .directory-links { grid-template-columns:1fr }}
</style></head><body class="prototype-directory">
<header class="directory-header"><h1>PodLens</h1><button class="directory-theme" id="directory-theme" type="button" aria-label="切换到深色主题" title="切换到深色主题">深色主题</button></header>
<main><div class="directory-grid"><section><h2>Desktop</h2><p>glaze 桌面载体 · 现有设计基线</p><nav class="directory-links" aria-label="桌面页面"><a href="prototype/home.html" title="PodLens — 主页">主页</a><a href="prototype/discover.html" title="PodLens — 发现">发现</a><a href="prototype/episodes.html" title="PodLens — 单集列表">单集列表</a><a href="prototype/transcript.html" title="PodLens — 逐句稿">逐句稿</a><a href="prototype/summary.html" title="PodLens — 总结">总结</a><a href="prototype/settings.html" title="PodLens — 设置">设置</a></nav></section><section><h2>Mobile</h2><p>原生 iOS 应用设计契约 · 390px 内容画布</p><nav class="directory-links" aria-label="移动页面"><a href="prototype/mobile-home.html" title="PodLens — 主页 · iPhone">主页</a><a href="prototype/mobile-now-playing.html" title="PodLens — 正在播放 · iPhone">全屏播放</a><a href="prototype/mobile-episodes.html" title="PodLens — 单集 · iPhone">单集列表</a><a href="prototype/mobile-discover.html" title="PodLens — 发现 · iPhone">发现与订阅</a><a href="prototype/mobile-transcript.html" title="PodLens — 逐句稿 · iPhone">逐句稿与总结</a><a href="prototype/mobile-settings.html" title="PodLens — 设置 · iPhone">设置</a></nav></section></div>
<section class="directory-states"><h2>移动状态示例</h2><nav class="directory-links" aria-label="移动状态示例"><a href="prototype/mobile-now-playing.html?state=empty-player" title="PodLens — 正在播放 · iPhone">无正在播放</a><a href="prototype/mobile-home.html?state=empty-subscriptions" title="PodLens — 主页 · iPhone">空订阅</a><a href="prototype/mobile-transcript.html?state=processing" title="PodLens — 逐句稿 · iPhone">转写处理中</a><a href="prototype/mobile-transcript.html?state=error" title="PodLens — 逐句稿 · iPhone">转写失败与恢复</a><a href="prototype/mobile-transcript.html?section=summary" title="PodLens — 逐句稿 · iPhone">总结锚点回溯</a></nav></section>
<a class="directory-contract" href="DESIGN.md">查看设计契约</a></main>
<script>
const themeButton=document.getElementById('directory-theme');
themeButton.addEventListener('click',()=>{const dark=document.documentElement.classList.toggle('dark');const name=`切换到${dark?'浅色':'深色'}主题`;themeButton.textContent=dark?'浅色主题':'深色主题';themeButton.setAttribute('aria-label',name);themeButton.title=name;});
</script></body></html>
