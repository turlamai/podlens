# Flatpak bundle manifest for the release payload (issue: the Linux
# distribution contract — deb+rpm+AppImage+Flatpak+tar.gz).
#
# CI renders the __VERSION__ / __ARCH__ / __SHA256__ placeholders from the
# linux tar.gz it just built and writes the generated manifest to the repo
# root (see .github/workflows/release.yml, the Flatpak step):
#
#   sed -e "s/__VERSION__/.../" -e "s/__ARCH__/.../" -e "s/__SHA256__/.../" \
#     flatpak/site.jrtx.podlens.yml > site.jrtx.podlens.gen.yml
#   flatpak-builder --user --force-clean --repo=repo build-dir site.jrtx.podlens.gen.yml
#   flatpak build-bundle repo podlens-<v>-linux-<arch>.flatpak site.jrtx.podlens
#
# The payload is self-contained (embedded Racket CS runtime, res/, app/);
# like every family product, readelf on the release binary shows exactly two
# NEEDED entries outside the GNOME Platform runtime — liblz4.so.1 and
# libtinfo.so.6 — provided by the two small modules below. GStreamer needs
# no module of its own: the GNOME runtime ships the full plugin set
# (base/good/bad/ugly + libav), covering the m4a/mp3 closure the deb
# side-payload carries for native installs.
app-id: site.jrtx.podlens
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: RivetHost
# The release contract bundles from branch `stable` (build-bundle arg);
# builder otherwise commits to master.
branch: stable
separate-locales: false
finish-args:
  # prefer_xwayland_backend() picks X11 exactly when DISPLAY is set and
  # WAYLAND_DISPLAY is not; granting only the X11 socket keeps that
  # decision deterministic.
  - --socket=x11
  - --device=dri
  - --share=ipc
  # Playback is a GStreamer playbin over the local audio cache; its
  # autoaudiosink goes through the session audio server (PulseAudio or
  # PipeWire's pulse replacement), so the pulse socket is the sound path.
  # No --device=all: playbin never opens ALSA/hardware devices directly.
  - --socket=pulseaudio
  # Network is the product: feed refresh and iTunes search (racket/core/
  # feed.rkt, itunes.rkt), streamed episode downloads into the cache
  # (http-download-file), OpenAI-compatible BYOK transcription/summary
  # requests (openai.rkt), and the signed-manifest update check (update.rkt)
  # all open sockets through net/http-client.
  - --share=network
  # No filesystem grant: library/config/audio live under PODLENS_DATA_DIR
  # or ~/.podlens, which the sandbox scopes to
  # ~/.var/app/site.jrtx.podlens automatically (a Flatpak install starts a
  # fresh library). No Secret Service talk-name: the BYOK key store
  # degrades to its documented 0600 file when secret-tool's bus is
  # unreachable (racket/core/secrets.rkt degrades instead of raising).
modules:
  - name: lz4
    # Upstream keeps meson under build/ (flatpak-builder needs it at the
    # module root), so use the primary Makefile build — library only.
    buildsystem: simple
    build-commands:
      - make lib-release PREFIX=/app
      - make -C lib install PREFIX=/app
    sources:
      - type: git
        url: https://github.com/lz4/lz4.git
        tag: v1.9.4
        commit: 5ff839680134437dbf4678f3d0c7b371d84f4964
  - name: ncurses
    # libtinfo.so.6 only (the payload's NEEDED entry); no programs, no
    # terminfo database install — the host system's entries stay put.
    config-opts:
      - --prefix=/app
      - --with-shared
      - --with-termlib
      - --without-progs
      - --without-tack
      - --without-tests
      # We only need libtinfo; the C++ binding does not survive the
      # GNOME 50 SDK's GCC 15 libstdc++ (cstddef redefinition).
      - --without-cxx-binding
      - --without-cxx
      - --disable-db-install
    sources:
      - type: archive
        url: https://ftp.gnu.org/pub/gnu/ncurses/ncurses-6.5.tar.gz
        sha256: 136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6
  - name: podlens
    buildsystem: simple
    sources:
      - type: archive
        path: podlens-__VERSION__-linux-__ARCH__.tar.gz
        sha256: __SHA256__
      - type: file
        path: assets/branding/app.png
      - type: file
        path: flatpak/site.jrtx.podlens.desktop
    build-commands:
      # flatpak-builder strips the archive's leading directory: the payload
      # (RivetHost, runtime/, res/, app/) lands flat in the build dir.
      - mkdir -p /app/podlens
      - cp -a RivetHost runtime res app /app/podlens/
      # The bundle's `command` resolves on the sandbox PATH (/app/bin); the
      # payload lives outside it. A symlink keeps /proc/self/exe pointing
      # at the real binary so the runtime layout discovery works.
      - mkdir -p /app/bin
      - ln -s /app/podlens/RivetHost /app/bin/RivetHost
      - install -Dm644 app.png
                    /app/share/icons/hicolor/512x512/apps/site.jrtx.podlens.png
      - install -Dm644 site.jrtx.podlens.desktop
                    /app/share/applications/site.jrtx.podlens.desktop
